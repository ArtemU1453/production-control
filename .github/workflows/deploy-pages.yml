name: Deploy to GitHub Pages

# Builds the static PWA and publishes it to GitHub Pages on every push to main.
# One-time setup by the repository owner: Settings → Pages → Build and
# deployment → Source: "GitHub Actions".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project sites are served from /<repo>/, so the client is built with a
      # matching base path. Must equal the repository name (case-sensitive).
      VITE_BASE: /Kalkuliator-nariezchika-iOS/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build static client
        run: npx vite build

      - name: Add SPA fallback (deep links resolve to the app)
        run: cp dist/public/index.html dist/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
